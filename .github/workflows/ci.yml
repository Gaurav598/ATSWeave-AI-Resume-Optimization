name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://atsweave_ci:atsweave_ci@localhost:5432/atsweave_ci
      AUTH_SECRET: ci-only-not-for-deployment-change-before-use
      AUTH_DEMO_LOGIN: "true"
      AI_PROVIDER: mock
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atsweave_ci
          POSTGRES_PASSWORD: atsweave_ci
          POSTGRES_DB: atsweave_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:generate
      - run: npx prisma db push --skip-generate
      - run: node --import tsx prisma/seed.ts
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: node --import tsx scripts/verify-pipeline.ts
      - run: npm run build -- --webpack
