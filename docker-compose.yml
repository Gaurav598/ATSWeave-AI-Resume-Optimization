services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atsweave_dev
      POSTGRES_PASSWORD: atsweave_dev
      POSTGRES_DB: atsweave_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  latex:
    build: ./latex-service
    ports:
      - "8080:8080"

volumes:
  pgdata:
