services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atsweave_dev
      POSTGRES_PASSWORD: atsweave_dev
      POSTGRES_DB: atsweave_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  latex:
    build: ./latex-service
    ports:
      - "8080:8080"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://atsweave_dev:atsweave_dev@postgres:5432/atsweave_dev
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - latex

volumes:
  pgdata:
